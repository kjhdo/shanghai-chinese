<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#c62828">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="상하이 중국어">
<title>상하이 여행 중국어 회화</title>
<style>
:root {
  --red: #c62828;
  --red-dark: #8e1f1f;
  --gold: #e6a817;
  --ink: #1c1e21;
  --ink-2: #4a4f55;
  --ink-3: #7c848c;
  --line: #e6e8eb;
  --bg: #f3f4f6;
  --card: #ffffff;
  --radius: 16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
    "Malgun Gothic", "Noto Sans KR", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}

[hidden] { display: none !important; }

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
}

/* ---------- header ---------- */
.hdr {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: calc(10px + var(--safe-top)) 12px 8px;
  background: linear-gradient(180deg, #c62828 0%, #b32323 100%);
  color: #fff;
  box-shadow: 0 2px 12px rgba(0, 0, 0, .16);
}

.hdr-top { display: flex; align-items: center; gap: 8px; }

.brand { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }

.flag {
  font-size: 22px;
  line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .3));
}

.brand h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sub {
  margin: 1px 0 0;
  font-size: 11px;
  color: #ffd9d9;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.num-btn {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 5px 9px;
  border-radius: 11px;
  background: rgba(255, 255, 255, .16);
  font-size: 16px;
  line-height: 1.05;
  color: #fff;
}
.num-btn span { font-size: 9.5px; opacity: .9; letter-spacing: -.2px; }
.num-btn:active { background: rgba(255, 255, 255, .3); }

.search-wrap { position: relative; margin-top: 9px; }

#search {
  width: 100%;
  padding: 10px 34px 10px 34px;
  border: 0;
  border-radius: 12px;
  background: #fff;
  color: var(--ink);
  font-size: 16px; /* iOS에서 포커스 시 확대 방지 */
  font-family: inherit;
  outline: none;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .06);
}
#search::placeholder { color: #9aa1a8; font-size: 12.5px; }
#search::-webkit-search-cancel-button { display: none; }

.search-ico {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  opacity: .55;
  pointer-events: none;
}

.clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #eceef1;
  color: #5d646b;
  font-size: 12px;
  line-height: 26px;
  text-align: center;
}

/* ---------- chips ---------- */
.chips {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  padding-bottom: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  flex: none;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .17);
  color: #ffe8e8;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  transition: background .15s, color .15s;
}
.chip .cnt { font-size: 10.5px; opacity: .72; font-weight: 500; }
.chip[aria-pressed="true"] {
  background: #fff;
  color: var(--red);
}
.chip[aria-pressed="true"] .cnt { opacity: .6; }

/* ---------- list ---------- */
main { padding: 12px 12px calc(28px + var(--safe-bottom)); }

.meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 3px 8px;
  font-size: 11.5px;
  color: var(--ink-3);
}

.list { display: flex; flex-direction: column; gap: 9px; }

.card {
  position: relative;
  padding: 13px 14px 11px;
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: 0 1px 2px rgba(16, 20, 24, .06), 0 4px 14px rgba(16, 20, 24, .045);
}

.card-ko {
  display: block;
  padding-right: 34px;
  color: var(--ink-3);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -.2px;
}

.fav {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 17px;
  line-height: 34px;
  text-align: center;
  color: #cfd4d9;
  transition: transform .12s, color .12s;
}
.fav:active { transform: scale(.88); }
.fav[aria-pressed="true"] { color: var(--gold); }

.zh {
  margin: 3px 0 2px;
  font-size: 27px;
  font-weight: 800;
  line-height: 1.22;
  letter-spacing: .5px;
  color: var(--ink);
  word-break: break-word;
}

.py {
  color: var(--red);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .1px;
}

.kr {
  margin-top: 2px;
  color: var(--ink-2);
  font-size: 14px;
}

.note {
  margin-top: 7px;
  padding: 6px 9px;
  border-radius: 8px;
  background: #fdf6e3;
  color: #8a6a12;
  font-size: 11.5px;
  line-height: 1.4;
}

.card-actions {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.btn {
  flex: 1;
  padding: 9px 8px;
  border-radius: 10px;
  background: #f2f4f6;
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.btn:active { background: #e6e9ec; }
.btn.speak { background: #fdecec; color: var(--red); }
.btn.speak:active { background: #fbdcdc; }
.btn.show { background: #eef2ff; color: #3448a8; }
.btn.show:active { background: #e0e6ff; }

.empty {
  padding: 46px 20px;
  text-align: center;
  color: var(--ink-3);
  font-size: 14px;
}
.empty .big { font-size: 34px; display: block; margin-bottom: 10px; }
.empty p { margin: 4px 0; }
.empty .hint { font-size: 12px; color: #9aa1a8; }

.foot {
  padding: 4px 20px 18px;
  text-align: center;
  color: #a5acb3;
  font-size: 11px;
  line-height: 1.6;
}

/* ---------- overlay / big card ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  background: rgba(12, 14, 16, .55);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}

/* 보여주기 카드: 밝은 바탕 + 아주 큰 중국어 */
#bigcard { align-items: center; justify-content: center; padding: 0; background: #fff; }

.big-inner {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: calc(60px + var(--safe-top)) 20px calc(30px + var(--safe-bottom));
  text-align: center;
  background: #fff;
}

.big-close {
  position: absolute;
  top: calc(10px + var(--safe-top));
  right: 12px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #eef0f2;
  color: #4a4f55;
  font-size: 17px;
  line-height: 42px;
  text-align: center;
}

.big-zh {
  font-size: clamp(40px, 14vw, 96px);
  font-weight: 900;
  line-height: 1.18;
  letter-spacing: 1px;
  color: #111;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.big-py {
  margin-top: 18px;
  color: var(--red);
  font-size: clamp(16px, 4.6vw, 24px);
  font-weight: 700;
}

.big-ko {
  margin-top: 10px;
  color: #6b7178;
  font-size: clamp(14px, 3.8vw, 19px);
  font-weight: 600;
}

.big-inner.zoom .big-zh { font-size: clamp(52px, 19vw, 130px); }

.big-actions {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(16px + var(--safe-bottom));
  display: flex;
  gap: 8px;
  padding: 0 18px;
}

.big-actions .btn { padding: 13px 8px; font-size: 14px; background: #f1f3f5; }
.big-actions .btn.speak { background: var(--red); color: #fff; }

.tap-hint {
  margin-top: 26px;
  color: #b3b9bf;
  font-size: 12px;
}

/* ---------- numbers sheet ---------- */
#numModal { align-items: flex-end; }

.sheet {
  width: 100%;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  border-radius: 20px 20px 0 0;
  background: #fff;
  overflow: hidden;
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 16px 11px;
  border-bottom: 1px solid var(--line);
}
.sheet-head h2 { margin: 0; font-size: 16px; font-weight: 800; }
.sheet-head .sub2 { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

.sheet-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #eef0f2;
  color: #4a4f55;
  line-height: 32px;
  text-align: center;
}

.sheet-body {
  flex: 1 1 auto;
  min-height: 0;
  padding: 4px 14px calc(24px + var(--safe-bottom));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.num-group { margin-top: 14px; }
.num-group h3 {
  margin: 0 0 7px;
  font-size: 12px;
  font-weight: 800;
  color: var(--ink-3);
  letter-spacing: .2px;
}

.num-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
}

.num-item {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 9px 11px;
  border-radius: 11px;
  background: #f5f6f8;
  text-align: left;
}
.num-item:active { background: #e9ebee; }
.num-item .n {
  flex: none;
  min-width: 42px;
  color: var(--ink-3);
  font-size: 11.5px;
  font-weight: 700;
}
.num-item .c { font-size: 19px; font-weight: 800; line-height: 1.1; }
.num-item .p { font-size: 11px; color: var(--red); font-weight: 600; }
.num-item .k { font-size: 11.5px; color: var(--ink-2); }

.num-tip {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 11px;
  background: #fdf6e3;
  color: #8a6a12;
  font-size: 12px;
  line-height: 1.5;
}

/* ---------- toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(26px + var(--safe-bottom));
  transform: translateX(-50%) translateY(8px);
  z-index: 90;
  max-width: 88vw;
  padding: 11px 16px;
  border-radius: 12px;
  background: rgba(24, 26, 29, .93);
  color: #fff;
  font-size: 13px;
  line-height: 1.4;
  text-align: center;
  opacity: 0;
  transition: opacity .2s, transform .2s;
  pointer-events: none;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 620px) {
  body { max-width: 760px; margin: 0 auto; background: #e9ebee; }
  .hdr { border-radius: 0 0 18px 18px; }
  .zh { font-size: 30px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-top">
    <div class="brand">
      <span class="flag">🇨🇳</span>
      <div>
        <h1>상하이 여행 중국어</h1>
        <p class="sub">인터넷 없이 열려요 · 화면을 보여주세요</p>
      </div>
    </div>
    <button id="numBtn" class="num-btn" aria-label="숫자·단위 치트시트"><span aria-hidden="true">🔢</span><span>숫자</span></button>
  </div>
  <div class="search-wrap">
    <span class="search-ico" aria-hidden="true">🔍</span>
    <input id="search" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
      placeholder="한국어·병음·중국어 검색 (화장실 / duoshao / 多少钱)" aria-label="표현 검색">
    <button id="clearBtn" class="clear" hidden aria-label="검색어 지우기">✕</button>
  </div>
  <nav id="chips" class="chips" aria-label="카테고리"></nav>
</header>

<main>
  <div id="meta" class="meta"></div>
  <div id="list" class="list"></div>
  <div id="empty" class="empty" hidden>
    <span class="big" aria-hidden="true">🧭</span>
    <p id="emptyTitle">찾는 표현이 없어요</p>
    <p class="hint" id="emptyHint"></p>
  </div>
</main>

<footer class="foot">
  중국어를 탭하면 크게 보여줄 수 있어요 · ☆ 를 누르면 자주 쓰는 표현에 담겨요<br>
  소리는 기기의 중국어 음성(TTS)으로 읽어요 · 음성이 없어도 화면 보여주기로 쓸 수 있어요
</footer>

<!-- 보여주기: 크게 보여주는 카드 -->
<div id="bigcard" class="overlay" hidden role="dialog" aria-modal="true" aria-label="크게 보여주기">
  <div class="big-inner" id="bigInner">
    <button id="bigClose" class="big-close" aria-label="닫기">✕</button>
    <div class="big-zh" id="bigZh"></div>
    <div class="big-py" id="bigPy"></div>
    <div class="big-ko" id="bigKo"></div>
    <div class="tap-hint">중국어를 탭하면 읽어 줘요</div>
    <div class="big-actions">
      <button id="bigSpeak" class="btn speak">🔊 읽어주기</button>
      <button id="bigSize" class="btn">가 글자 크게</button>
    </div>
  </div>
</div>

<!-- 숫자·단위 치트시트 -->
<div id="numModal" class="overlay" hidden role="dialog" aria-modal="true" aria-label="숫자와 단위">
  <div class="sheet">
    <div class="sheet-head">
      <div>
        <h2>🔢 숫자 · 단위 치트시트</h2>
        <div class="sub2">숫자 항목을 탭하면 중국어로 읽어 줘요</div>
      </div>
      <button id="numClose" class="sheet-close" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="numBody"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
/* 순수 로직 — 브라우저(window.PhraseLogic)와 node(module.exports) 양쪽에서 쓴다. */
(function (root) {
  'use strict';

  var FAV_KEY = 'shq.favs.v1';
  var SEARCH_KEYS = ['ko', 'zh', 'py', 'kr', 'note'];

  function stripTones(s) {
    var t = String(s == null ? '' : s);
    if (t.normalize) t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return t;
  }

  // 검색 비교용 정규화: 성조표시·대소문자·공백·구두점을 없앤다.
  function normalize(s) {
    return stripTones(s)
      .toLowerCase()
      .replace(/[\s\-_.,!?~·'"’”“:;()\[\]{}]/g, '');
  }

  function haystack(p) {
    var parts = [];
    for (var i = 0; i < SEARCH_KEYS.length; i++) parts.push(p[SEARCH_KEYS[i]] || '');
    return normalize(parts.join(' '));
  }

  function searchPhrases(list, query) {
    var q = String(query == null ? '' : query);
    var nq = normalize(q);
    if (!nq) return list.slice();
    var tokens = q.trim().split(/\s+/).map(normalize).filter(Boolean);
    return list.filter(function (p) {
      var h = haystack(p);
      if (h.indexOf(nq) !== -1) return true;
      if (tokens.length > 1 && tokens.every(function (t) { return h.indexOf(t) !== -1; })) return true;
      return false;
    });
  }

  function inCategory(list, cat) {
    if (!cat || cat === 'all' || cat === 'fav') return list.slice();
    return list.filter(function (p) { return p.cat === cat; });
  }

  function byFavorites(list, favs) {
    var set = {};
    (favs || []).forEach(function (id) { set[id] = true; });
    return list.filter(function (p) { return !!set[p.id]; });
  }

  function toggleFavorite(favs, id) {
    var list = (favs || []).slice();
    var i = list.indexOf(id);
    if (i === -1) list.push(id);
    else list.splice(i, 1);
    return list;
  }

  function isFavorite(favs, id) {
    return (favs || []).indexOf(id) !== -1;
  }

  function countByCategory(list) {
    var out = { all: list.length };
    list.forEach(function (p) { out[p.cat] = (out[p.cat] || 0) + 1; });
    return out;
  }

  function readFavs(storage) {
    if (!storage) return [];
    try {
      var raw = storage.getItem(FAV_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(function (x) { return typeof x === 'string'; });
    } catch (e) {
      return [];
    }
  }

  function writeFavs(storage, favs) {
    if (!storage) return false;
    try {
      storage.setItem(FAV_KEY, JSON.stringify(favs || []));
      return true;
    } catch (e) {
      return false;
    }
  }

  // 화면에 그릴 목록을 만든다: 카테고리 → 즐겨찾기 → 검색 순.
  function buildList(phrases, favs, cat, query) {
    var base = inCategory(phrases, cat);
    if (cat === 'fav') base = byFavorites(phrases, favs);
    return searchPhrases(base, query);
  }

  function pickChineseVoice(voices) {
    var list = voices || [];
    for (var i = 0; i < list.length; i++) {
      if (/^zh[-_]?CN/i.test(list[i].lang || '')) return list[i];
    }
    for (var j = 0; j < list.length; j++) {
      if (/^zh/i.test(list[j].lang || '')) return list[j];
    }
    return null;
  }

  // TTS 가능 여부 판단 — 실패해도 앱은 '보여주기'로 계속 쓸 수 있어야 한다.
  function ttsStatus(win) {
    var w = win || {};
    if (!('speechSynthesis' in w) || typeof w.SpeechSynthesisUtterance !== 'function') {
      return { ok: false, reason: 'unsupported' };
    }
    var voices = [];
    try { voices = w.speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
    var zh = pickChineseVoice(voices);
    if (voices.length && !zh) return { ok: true, reason: 'no-zh-voice', voice: null };
    return { ok: true, reason: zh ? 'zh-voice' : 'no-voice-list', voice: zh };
  }

  var api = {
    FAV_KEY: FAV_KEY,
    stripTones: stripTones,
    normalize: normalize,
    haystack: haystack,
    searchPhrases: searchPhrases,
    inCategory: inCategory,
    byFavorites: byFavorites,
    toggleFavorite: toggleFavorite,
    isFavorite: isFavorite,
    countByCategory: countByCategory,
    readFavs: readFavs,
    writeFavs: writeFavs,
    buildList: buildList,
    pickChineseVoice: pickChineseVoice,
    ttsStatus: ttsStatus
  };

  root.PhraseLogic = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : this));

<script>
/* 상하이 여행 중국어 — UI (외부 요청 없음) */
(function () {
  'use strict';

  var L = window.PhraseLogic;
  var DATA = window.PHRASE_DATA || { phrases: [], cats: [], numbers: [] };
  var phrases = DATA.phrases || [];
  var cats = DATA.cats || [];
  var numGroups = DATA.numbers || [];

  function safeStorage() {
    try {
      var k = '__shq_probe__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return window.localStorage;
    } catch (e) {
      // file:// 등에서 localStorage가 막혀도 이번 실행 동안은 똑같이 동작하게
      var mem = {};
      return {
        getItem: function (key) { return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : null; },
        setItem: function (key, val) { mem[key] = String(val); },
        removeItem: function (key) { delete mem[key]; }
      };
    }
  }

  var store = safeStorage();
  var state = { q: '', cat: 'all', favs: L.readFavs(store), bigId: null };

  var els = {
    search: document.getElementById('search'),
    clear: document.getElementById('clearBtn'),
    chips: document.getElementById('chips'),
    list: document.getElementById('list'),
    meta: document.getElementById('meta'),
    empty: document.getElementById('empty'),
    emptyTitle: document.getElementById('emptyTitle'),
    emptyHint: document.getElementById('emptyHint'),
    big: document.getElementById('bigcard'),
    bigZh: document.getElementById('bigZh'),
    bigPy: document.getElementById('bigPy'),
    bigKo: document.getElementById('bigKo'),
    bigSpeak: document.getElementById('bigSpeak'),
    bigSize: document.getElementById('bigSize'),
    bigInner: document.getElementById('bigInner'),
    bigClose: document.getElementById('bigClose'),
    num: document.getElementById('numModal'),
    numBody: document.getElementById('numBody'),
    numBtn: document.getElementById('numBtn'),
    numClose: document.getElementById('numClose'),
    toast: document.getElementById('toast')
  };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var toastTimer = null;
  function toast(msg, ms) {
    if (!els.toast) return;
    els.toast.textContent = msg;
    els.toast.hidden = false;
    // reflow so the transition runs again
    void els.toast.offsetWidth;
    els.toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      els.toast.classList.remove('on');
      setTimeout(function () { els.toast.hidden = true; }, 220);
    }, ms || 2600);
  }

  /* ---------------- chips ---------------- */
  function renderChips() {
    var counts = L.countByCategory(phrases);
    var favCount = L.byFavorites(phrases, state.favs).length;
    var html = '';
    cats.forEach(function (c) {
      var n = c.id === 'all' ? phrases.length : (c.id === 'fav' ? favCount : (counts[c.id] || 0));
      var on = state.cat === c.id ? 'true' : 'false';
      html += '<button class="chip" data-cat="' + esc(c.id) + '" aria-pressed="' + on + '">' +
        '<span>' + esc(c.emoji) + '</span><span>' + esc(c.name) + '</span>' +
        '<span class="cnt">' + n + '</span></button>';
    });
    els.chips.innerHTML = html;
  }

  /* ---------------- list ---------------- */
  function phraseCard(p) {
    var fav = L.isFavorite(state.favs, p.id);
    return '<article class="card" data-id="' + esc(p.id) + '">' +
      '<span class="card-ko">' + esc(p.ko) + '</span>' +
      '<button class="fav" data-act="fav" aria-pressed="' + (fav ? 'true' : 'false') + '" ' +
      'aria-label="자주 쓰는 표현에 담기">' + (fav ? '★' : '☆') + '</button>' +
      '<div class="zh" data-act="show">' + esc(p.zh) + '</div>' +
      '<div class="py">' + esc(p.py) + '</div>' +
      '<div class="kr">' + esc(p.kr) + '</div>' +
      (p.note ? '<div class="note">💡 ' + esc(p.note) + '</div>' : '') +
      '<div class="card-actions">' +
      '<button class="btn speak" data-act="speak">🔊 말하기</button>' +
      '<button class="btn show" data-act="show">📺 보여주기</button>' +
      '</div></article>';
  }

  function render() {
    var items = L.buildList(phrases, state.favs, state.cat, state.q);
    els.list.innerHTML = items.map(phraseCard).join('');
    var searching = !!state.q.trim();
    els.meta.innerHTML = '<span>' +
      (searching ? ('검색 결과 <b>' + items.length + '</b>개') : ('표현 <b>' + items.length + '</b>개')) +
      '</span><span>⭐ ' + L.byFavorites(phrases, state.favs).length + '개 담김</span>';

    if (!items.length) {
      els.empty.hidden = false;
      if (state.cat === 'fav' && !searching) {
        els.emptyTitle.textContent = '아직 담은 표현이 없어요';
        els.emptyHint.textContent = '카드 오른쪽 ☆ 를 눌러두면 여기에 모여요.';
      } else {
        els.emptyTitle.textContent = '찾는 표현이 없어요';
        els.emptyHint.textContent = '한국어 · 병음 · 중국어 어느 쪽으로도 검색돼요. 예: 화장실, duoshao, 多少钱';
      }
    } else {
      els.empty.hidden = true;
    }
    els.clear.hidden = !searching;
  }

  function renderAll() {
    renderChips();
    render();
  }

  /* ---------------- TTS ---------------- */
  var voiceWarned = false;
  var voicesLoaded = false;

  function currentVoice() {
    var synth = window.speechSynthesis;
    if (!synth) return null;
    var voices = [];
    try { voices = synth.getVoices() || []; } catch (e) { voices = []; }
    if (voices.length) voicesLoaded = true;
    return L.pickChineseVoice(voices);
  }

  var speakSeq = 0;

  function speak(text) {
    if (!('speechSynthesis' in window) || typeof window.SpeechSynthesisUtterance !== 'function') {
      toast('이 브라우저는 읽어주기를 지원하지 않아요. 화면을 보여주세요.');
      return false;
    }
    var u = new window.SpeechSynthesisUtterance(String(text || ''));
    u.lang = 'zh-CN';
    u.rate = 0.82;
    u.pitch = 1;
    var v = currentVoice();
    if (v) u.voice = v;
    var seq = ++speakSeq;
    try {
      window.speechSynthesis.cancel();
      // iOS는 cancel 직후 같은 틱의 speak를 삼키는 경우가 있어 살짝 띄운다
      setTimeout(function () {
        if (seq !== speakSeq) return;
        try { window.speechSynthesis.speak(u); } catch (e) { /* 무시 */ }
      }, 60);
    } catch (e) {
      toast('음성을 재생하지 못했어요.');
      return false;
    }
    if (!v && !voiceWarned) {
      voiceWarned = true;
      toast('중국어 음성이 없어 기본 음성으로 읽어요. 화면 보여주기를 함께 쓰세요.', 3200);
    }
    return true;
  }

  if ('speechSynthesis' in window && typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
    window.speechSynthesis.onvoiceschanged = function () {
      voicesLoaded = true;
      currentVoice();
    };
  }

  /* ---------------- big card ---------------- */
  function byId(id) {
    for (var i = 0; i < phrases.length; i++) if (phrases[i].id === id) return phrases[i];
    return null;
  }

  function openBig(id) {
    var p = byId(id);
    if (!p) return;
    state.bigId = id;
    els.bigZh.textContent = p.zh;
    els.bigPy.textContent = p.py;
    els.bigKo.textContent = p.ko + '  ·  ' + p.kr;
    els.bigInner.classList.remove('zoom');
    els.big.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    try { history.pushState({ shq: 'big' }, ''); } catch (e) { /* file:// */ }
  }

  function hideBig() {
    if (els.big.hidden) return;
    els.big.hidden = true;
    state.bigId = null;
    document.documentElement.style.overflow = '';
  }

  function closeBig() {
    var wasOpen = !els.big.hidden;
    hideBig();
    if (wasOpen) {
      try {
        if (history.state && history.state.shq) history.back();
      } catch (e) { /* ignore */ }
    }
  }

  /* ---------------- numbers ---------------- */
  function renderNumbers() {
    var html = '';
    numGroups.forEach(function (g) {
      html += '<section class="num-group"><h3>' + esc(g.group) + '</h3><div class="num-grid">';
      (g.items || []).forEach(function (it) {
        html += '<button class="num-item" data-zh="' + esc(it.zh) + '">' +
          '<span class="n">' + esc(it.n) + '</span>' +
          '<span><span class="c">' + esc(it.zh) + '</span> ' +
          '<span class="p">' + esc(it.py) + '</span><br>' +
          '<span class="k">' + esc(it.kr) + (it.memo ? ' · ' + esc(it.memo) : '') + '</span></span>' +
          '</button>';
      });
      html += '</div></section>';
    });
    html += '<div class="num-tip">가게에서는 보통 <b>块(콰이)</b>로 말해요. 예: 38块 = 싼스바 콰이. ' +
      '숫자를 탭하면 중국어로 읽어 줘요.</div>';
    els.numBody.innerHTML = html;
  }

  function openNumbers() {
    els.num.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    try { history.pushState({ shq: 'num' }, ''); } catch (e) { /* ignore */ }
  }

  function hideNumbers() {
    if (els.num.hidden) return;
    els.num.hidden = true;
    if (els.big.hidden) document.documentElement.style.overflow = '';
  }

  function closeNumbers() {
    var wasOpen = !els.num.hidden;
    hideNumbers();
    if (wasOpen) {
      try { if (history.state && history.state.shq) history.back(); } catch (e) { /* ignore */ }
    }
  }

  /* ---------------- events ---------------- */
  function onSearch() {
    state.q = els.search.value || '';
    render();
    els.search.focus({ preventScroll: true });
  }

  els.search.addEventListener('input', onSearch);
  els.search.addEventListener('search', onSearch);

  els.clear.addEventListener('click', function () {
    els.search.value = '';
    state.q = '';
    render();
    els.search.focus({ preventScroll: true });
  });

  els.chips.addEventListener('click', function (ev) {
    var chip = ev.target.closest('.chip');
    if (!chip) return;
    state.cat = chip.getAttribute('data-cat');
    renderChips();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  els.list.addEventListener('click', function (ev) {
    var card = ev.target.closest('.card');
    if (!card) return;
    var id = card.getAttribute('data-id');
    var actEl = ev.target.closest('[data-act]');
    var act = actEl ? actEl.getAttribute('data-act') : null;

    if (act === 'fav') {
      state.favs = L.toggleFavorite(state.favs, id);
      L.writeFavs(store, state.favs);
      var on = L.isFavorite(state.favs, id);
      actEl.setAttribute('aria-pressed', on ? 'true' : 'false');
      actEl.textContent = on ? '★' : '☆';
      renderChips();
      if (state.cat === 'fav' && !on) render();
      else els.meta.innerHTML = '<span>표현 <b>' + L.buildList(phrases, state.favs, state.cat, state.q).length +
        '</b>개</span><span>⭐ ' + L.byFavorites(phrases, state.favs).length + '개 담김</span>';
      toast(on ? '⭐ 자주 쓰는 표현에 담았어요' : '⭐ 에서 뺐어요', 1500);
      return;
    }
    if (act === 'speak') {
      var p1 = byId(id);
      if (p1) speak(p1.zh);
      return;
    }
    if (act === 'show') {
      openBig(id);
      return;
    }
  });

  els.bigClose.addEventListener('click', closeBig);
  els.big.addEventListener('click', function (ev) {
    if (ev.target === els.big) closeBig();
  });
  els.bigSpeak.addEventListener('click', function () {
    if (state.bigId) {
      var p = byId(state.bigId);
      if (p) speak(p.zh);
    }
  });
  els.bigSize.addEventListener('click', function () {
    els.bigInner.classList.toggle('zoom');
    var z = els.bigInner.classList.contains('zoom');
    els.bigSize.textContent = z ? '가 글자 원래대로' : '가 글자 크게';
  });
  els.bigZh.addEventListener('click', function () {
    if (state.bigId) {
      var p = byId(state.bigId);
      if (p) speak(p.zh);
    }
  });

  els.numBtn.addEventListener('click', openNumbers);
  els.numClose.addEventListener('click', closeNumbers);
  els.num.addEventListener('click', function (ev) {
    if (ev.target === els.num) closeNumbers();
  });
  els.numBody.addEventListener('click', function (ev) {
    var item = ev.target.closest('.num-item');
    if (item) speak(item.getAttribute('data-zh'));
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (!els.big.hidden) closeBig();
    else if (!els.num.hidden) closeNumbers();
  });

  window.addEventListener('popstate', function () {
    if (!els.big.hidden) hideBig();
    if (!els.num.hidden) hideNumbers();
    document.documentElement.style.overflow = '';
  });

  /* ---------------- start ---------------- */
  renderAll();
  renderNumbers();

  window.__shq = {
    state: state,
    els: els,
    render: render,
    renderAll: renderAll,
    openBig: openBig,
    closeBig: closeBig,
    openNumbers: openNumbers,
    closeNumbers: closeNumbers,
    speak: speak,
    toast: toast,
    logic: L,
    data: DATA
  };
})();

</script>
<script>
(function(){
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
})();
</script>
</body>
